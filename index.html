<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#f2f4f7;
}

/* HEADER */
.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:15px;
}

.profile{
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:45px;
  height:45px;
  background:#1b5e20;
  color:#fff;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.header-text small{
  color:#4caf50;
}

.header-text h3{
  font-size:16px;
}

/* CARD GREEN */
.card{
  margin:15px;
  background:linear-gradient(135deg,#0aa66c,#0d8f5a);
  border-radius:20px;
  padding:15px;
  color:#fff;
}

/* SALDO */
.saldo-container{
  display:flex;
  gap:10px;
}

.saldo-box{
  flex:1;
  background:#fff;
  color:#000;
  border-radius:15px;
  padding:10px;
}

.saldo-box h4{
  font-size:14px;
  margin-bottom:5px;
}

.saldo-box p{
  font-weight:bold;
}

/* MENU */
.menu{
  margin-top:15px;
  display:flex;
  justify-content:space-between;
}

.menu-item{
  width:22%;
  background:#0a5f2f;
  padding:10px;
  border-radius:12px;
  text-align:center;
  color:#fff;
  font-size:12px;
}

/* MAP */
.map-section{
  margin:15px;
}

.map{
  width:100%;
  height:200px;
  border-radius:15px;
  background:url('https://maps.gstatic.com/tactile/basepage/pegman_sherlock.png');
  background-size:cover;
}

/* PENCAPAIAN */
.pencapaian{
  margin:15px;
  background:#fff;
  padding:15px;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.progress{
  width:70%;
}

.progress-bar{
  height:6px;
  background:#ddd;
  border-radius:10px;
  margin-top:8px;
}

.progress-fill{
  width:40%;
  height:100%;
  background:#4caf50;
  border-radius:10px;
}

/* NAVBAR */
.navbar{
  position:fixed;
  bottom:0;
  width:100%;
  background:#fff;
  display:flex;
  justify-content:space-around;
  padding:10px 0;
  border-top:1px solid #ddd;
}

.nav-item{
  text-align:center;
  font-size:12px;
  color:#999;
}

.nav-item.active{
  color:#1b5e20;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="profile">
    <div class="avatar">U</div>
    <div class="header-text">
      <small>Selamat datang kembali,</small>
      <h3>User</h3>
    </div>
  </div>
  🔔
</div>

<!-- CARD -->
<div class="card">

  <div class="saldo-container">
    <div class="saldo-box">
      <h4>Saldo</h4>
      <p>RP 0</p>
    </div>
    <div class="saldo-box">
      <h4>Reward/Liter</h4>
      <p>RP 0</p>
    </div>
  </div>

  <div class="menu">
    <div class="menu-item">Capaian</div>
    <div class="menu-item">Informasi</div>
    <div class="menu-item">Tarik</div>
    <div class="menu-item">Mutasi</div>
  </div>

</div>

<!-- MAP -->
<div class="map-section">
  <h3>Informasi Harga Real-time</h3>
  <div class="map"></div>
</div>

<!-- PENCAPAIAN -->
<div class="pencapaian">
  <div class="progress">
    <h4>25 Liter ke tingkat berikutnya </h4>
    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>
  </div>
  <div style="font-size:40px;">🧴</div>
</div>

<!-- NAVBAR -->
<div class="navbar">
  <div class="nav-item active">Beranda</div>
  <div class="nav-item">Dampak Hijau</div>
  <div class="nav-item">Profil</div>
</div>

</body>
</html>
